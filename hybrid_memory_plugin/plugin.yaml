name: hybrid_memory
version: 1.0.0
description: "Local-first shared memory service — one canonical DuckDB + Kùzu relationship graph with local sentence-transformers embeddings. Automatic extraction creates reviewable proposals; works across personal, work, tech, relationship, and goal contexts."
pip_dependencies:
  - duckdb
  - kuzu
  - sentence-transformers
requires_env: []
hooks:
  - on_turn_start
  - sync_turn
  - on_session_end
  - on_session_switch
