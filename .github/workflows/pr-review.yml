# Review PRs from Devin — approves+auto-merges or requests changes
name: "PR Review (Hermes)"

on:
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  review:
    # Only review PRs labeled "devin-implemented"
    if: >
      github.event.action == 'labeled' && github.event.label.name == 'devin-implemented'
      || github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'devin-implemented')
      || github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'devin-implemented')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Review PR with Hermes via OpenRouter"
        id: review
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/review-pr.sh
          .github/scripts/review-pr.sh

      - name: "Notify on failure"
        if: failure() && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "⚠️ **Hermes PR review failed** — the API call did not complete.
            Check the [Action logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."