name: CI (change-scoped)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compute changed test files
        id: changed
        run: |
          # Base SHA for the diff: PR base for PRs, previous commit for pushes.
          # Fall back to HEAD~1 if github.event.before is empty (e.g. first push
          # to a branch or API-triggered runs).
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "No base SHA available — skipping pytest (smoke only)."
            echo "TESTS=" >> "$GITHUB_ENV"
            exit 0
          fi
          # Changed test files (excluding known-env-dependent ones)
          TESTS=$(git diff --name-only "$BASE" HEAD -- argos_plugin/tests/ | grep '\\.py$' || true)
          # Add test files matching changed source modules (e.g. store.py -> test_store*.py)
          SRC=$(git diff --name-only "$BASE" HEAD -- argos_plugin/ | grep -v '/tests/' | sed 's|.*/||; s|\.py$||' | sort -u)
          for m in $SRC; do
            TESTS="$TESTS $(ls argos_plugin/tests/ 2>/dev/null | grep -i "${m}" | sed 's|^|argos_plugin/tests/|' || true)"
          done
          TESTS=$(echo "$TESTS" | tr ' ' '\n' | grep -vE 'test_popia_deployment|test_tenant_provisioning|test_temporal_injection|test_weather' | sort -u | tr '\n' ' ')
          # Trim trailing whitespace: an untrimmed " " makes `[ -n "$TESTS" ]`
          # true and runs pytest with no file args (full-suite collection →
          # env-broken failures). Empty must be truly empty.
          TESTS=$(echo "$TESTS" | xargs)
          echo "TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "Running: ${TESTS:-<none - smoke only>}"

      - name: Run relevant tests
        run: |
          # Tier 0 (#292): the deterministic retrieval smoke runs on EVERY
          # PR (seconds, no LLM/embedder/network) — always appended.
          if [ -n "$TESTS" ]; then
            python -m pytest $TESTS argos_plugin/tests/test_retrieval_smoke_gate.py -q --timeout 300 -p no:cacheprovider
          else
            python -m pytest argos_plugin/tests/test_retrieval_smoke_gate.py -q --timeout 300 -p no:cacheprovider
          fi
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: "."

  tier1-slice:
    name: Tier 1 — curated retrieval slice (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #292: runs ONLY on retrieval/embedding-touching PRs (path trigger
    # list: argos_plugin/eval/ci_retrieval_paths.txt). Non-blocking
    # background check — the delta-vs-baseline report is visible, but an
    # env flake cannot block the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (minimal — text-only slice)
        # MINIMAL install (PR #337 re-review): the slice store is
        # embedder=None (text-leg only), so duckdb + pytest suffice.
        # The full requirements.txt (torch + sentence-transformers)
        # would make this job slow enough that the workflow-level
        # concurrency cancel (cancel-in-progress on iterative PRs)
        # would routinely kill it mid-run.
        run: pip install duckdb==1.5.5 pytest==9.1.1 pytest-timeout==2.3.1

      - name: Detect retrieval-touching paths
        id: trigger
        # set -eo pipefail: if the trigger probe errors, FAIL the step
        # loudly instead of silently emitting an empty RUN (which would
        # skip the slice via the env.RUN == 'True' guard).
        shell: bash
        run: |
          set -eo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "No base SHA — skipping tier 1."
            echo "RUN=false" >> "$GITHUB_ENV"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          # The trigger list is the checked-in ci_retrieval_paths.txt —
          # one source of truth shared with the test suite.
          PROBE_OUT=$(python argos_plugin/eval/ci_tier1_slice.py --paths $CHANGED)
          RUN=$(echo "$PROBE_OUT" | grep -oE 'True|False' | tail -1)
          if [ -z "$RUN" ]; then
            echo "trigger probe produced no decision: $PROBE_OUT" >&2
            exit 2
          fi
          echo "tier1 trigger: $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Run the curated slice (delta vs recorded baseline)
        if: env.RUN == 'True'
        run: |
          # ~12 curated probes (temporal / conflict / provenance /
          # injection / negation / entity) on a deterministic synthetic
          # store — no LLM, no embedder, no snapshot. Regression =
          # DELTA vs the recorded baseline (never absolute).
          python -m pytest argos_plugin/tests/test_ci_tier1_slice.py -q --timeout 600 -p no:cacheprovider
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: "."