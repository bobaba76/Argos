name: hybrid_memory
version: 1.0.0
description: "Local-first memory — DuckDB vector search + Kùzu relationship graph + local sentence-transformers embeddings. Optional LLM extraction; works across personal, work, tech, relationship, and goal contexts."
pip_dependencies:
  - duckdb
  - kuzu
  - sentence-transformers
requires_env: []
hooks:
  - on_turn_start
  - sync_turn
  - on_session_end
  - on_session_switch
