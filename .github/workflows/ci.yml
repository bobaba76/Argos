name: CI (change-scoped)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compute changed test files
        id: changed
        run: |
          # Base SHA for the diff: PR base for PRs, previous commit for pushes.
          # #368: the old fallback (HEAD~1 only) resolved empty on PR pushes
          # where the base ref isn't present at checkout, or on the first
          # commit of a new branch → "No base SHA available — skipping
          # pytest (smoke only)" → the green badge was vacuous (the PR's own
          # tests never ran). Fix: resolve a real merge-base against master
          # before falling back to HEAD~1, and fail-closed if still empty.
          # Ensure origin/master is present (fetch-depth: 0 above covers PR
          # history, but master itself may not be in the shallow clone).
          git fetch origin master --depth=1 2>/dev/null || true
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base HEAD origin/master 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            # #368: fail-closed. An empty base must never masquerade as a
            # green smoke-only run — the PR's tests would be silently
            # skipped. Fail loudly instead.
            echo "::error::Could not resolve a base SHA for change-scoped test selection (PR base, merge-base, and HEAD~1 all empty). Refusing to run smoke-only as a vacuously green pass."
            exit 1
          fi
          # Changed test files (excluding known-env-dependent ones)
          TESTS=$(git diff --name-only "$BASE" HEAD -- argos_plugin/tests/ | grep '\\.py$' || true)
          # Add test files matching changed source modules (e.g. store.py -> test_store*.py)
          SRC=$(git diff --name-only "$BASE" HEAD -- argos_plugin/ | grep -v '/tests/' | sed 's|.*/||; s|\.py$||' | sort -u)
          for m in $SRC; do
            TESTS="$TESTS $(ls argos_plugin/tests/ 2>/dev/null | grep -i "${m}" | sed 's|^|argos_plugin/tests/|' || true)"
          done
          TESTS=$(echo "$TESTS" | tr ' ' '\n' | grep -vE 'test_popia_deployment|test_tenant_provisioning|test_temporal_injection|test_weather' | sort -u | tr '\n' ' ')
          # Trim trailing whitespace: an untrimmed " " makes `[ -n "$TESTS" ]`
          # true and runs pytest with no file args (full-suite collection →
          # env-broken failures). Empty must be truly empty.
          TESTS=$(echo "$TESTS" | xargs)
          echo "TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "Base: $BASE"
          echo "Running: ${TESTS:-<none - smoke only>}"

      - name: Run relevant tests
        run: |
          # Tier 0 (#292/#350): deterministic retrieval smoke + claims-audit
          # parity guard run on EVERY PR (seconds, no LLM/embedder/network) — always appended..
          if [ -n "$TESTS" ]; then
            python -m pytest $TESTS argos_plugin/tests/test_retrieval_smoke_gate.py argos_plugin/tests/test_claims_audit_parity.py -q --timeout 300 -p no:cacheprovider
          else
            python -m pytest argos_plugin/tests/test_retrieval_smoke_gate.py argos_plugin/tests/test_claims_audit_parity.py -q --timeout 300 -p no:cacheprovider
          fi
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: "."

  tier1-slice:
    name: Tier 1 — curated retrieval slice (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #292: runs ONLY on retrieval/embedding-touching PRs (path trigger
    # list: argos_plugin/eval/ci_retrieval_paths.txt). Non-blocking
    # background check — the delta-vs-baseline report is visible, but an
    # env flake cannot block the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (minimal — text-only slice)
        # MINIMAL install (PR #337 re-review): the slice store is
        # embedder=None (text-leg only), so torch + sentence-transformers
        # are NOT needed. The full requirements.txt would make this job
        # slow enough that the workflow-level concurrency cancel
        # (cancel-in-progress on iterative PRs) would routinely kill it
        # mid-run.
        # The slice IS a real store-path test: the conftest registers an
        # 'argos' alias that imports argos_plugin/__init__.py, whose
        # import chain pulls service_client → memory_service →
        # config_model → pydantic. store_common.py imports numpy at
        # module level (with a try/except fallback, but we include it so
        # the slice matches production behaviour). duckdb is the store
        # backend. kuzu/sentence-transformers are lazy-imported inside
        # methods and are NOT needed at collection time.
        run: pip install duckdb==1.5.5 pydantic==2.13.4 numpy pytest==9.1.1 pytest-timeout==2.3.1

      - name: Detect retrieval-touching paths
        id: trigger
        # set -eo pipefail: if the trigger probe errors, FAIL the step
        # loudly instead of silently emitting an empty RUN (which would
        # skip the slice via the env.RUN == 'True' guard).
        shell: bash
        run: |
          set -eo pipefail
          # #368: same base-SHA resolution fix as the test job. Ensure
          # origin/master is fetched (checkout has fetch-depth: 0 but
          # master may not be in the clone for push events).
          git fetch origin master --depth=1 2>/dev/null || true
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base HEAD origin/master 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "::error::Could not resolve a base SHA for tier-1 trigger detection (PR base, merge-base, and HEAD~1 all empty)."
            exit 1
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          # The trigger list is the checked-in ci_retrieval_paths.txt —
          # one source of truth shared with the test suite.
          PROBE_OUT=$(python argos_plugin/eval/ci_tier1_slice.py --paths $CHANGED)
          RUN=$(echo "$PROBE_OUT" | grep -oE 'True|False' | tail -1)
          if [ -z "$RUN" ]; then
            echo "trigger probe produced no decision: $PROBE_OUT" >&2
            exit 2
          fi
          echo "tier1 trigger: $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Run the curated slice (delta vs recorded baseline)
        if: env.RUN == 'True'
        run: |
          # ~12 curated probes (temporal / conflict / provenance /
          # injection / negation / entity) on a deterministic synthetic
          # store — no LLM, no embedder, no snapshot. Regression =
          # DELTA vs the recorded baseline (never absolute).
          python -m pytest argos_plugin/tests/test_ci_tier1_slice.py -q --timeout 600 -p no:cacheprovider
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONPATH: "."